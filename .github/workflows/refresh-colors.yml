name: Refresh country colors

# The map always loads the newest Overture boundaries by itself. This job
# just re-checks which countries border each other in the latest release and
# updates data/country-colors.json so newly created or redrawn countries never
# share a color with a neighbor.

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday 06:17 UTC (Overture releases monthly)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run colors
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/country-colors.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/country-colors.json
          git commit -m "Refresh country colors for Overture $(node -p "require('./data/country-colors.json').release")"
          git push
