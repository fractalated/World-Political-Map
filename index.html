<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World Political Map</title>
  <meta name="description" content="A full-screen, always-current, zoomable world political map built on OpenStreetMap and Overture Maps data.">
  <meta name="theme-color" content="#a9cde0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23a9cde0'/%3E%3Cpath d='M14 22c6-6 14-8 20-4s4 10-2 12-6 8-2 12-14 2-18-6-4-10 2-14zM40 14c6 2 12 8 12 16s-6 6-8 2-8-4-6-10 0-9 2-8z' fill='%23f1d3a0' stroke='%236e6070' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.3.2/dist/pmtiles.js"></script>
</head>
<body>
  <div id="map" aria-label="World political map"></div>

  <div id="controls" aria-label="Map controls">
    <button id="btn-land" type="button" title="Show land ownership" aria-label="Show land ownership and parcels" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 11h7v8M11 11l5-6M11 11h9"/></svg>
    </button>
    <button id="btn-globe" type="button" title="Switch to globe view" aria-label="Toggle globe view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
    </button>
    <button id="btn-world" type="button" title="Show the whole world" aria-label="Zoom out to the whole world">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <form id="search" role="search" autocomplete="off">
    <svg class="s-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="search-input" type="search" enterkeyhint="search" spellcheck="false"
           placeholder="Search places or coordinates" aria-label="Search for a place, address, or coordinates"
           aria-controls="chooser-list" aria-autocomplete="list">
    <span class="s-spin" aria-hidden="true"></span>
    <button id="search-clear" type="button" aria-label="Clear search" title="Clear">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <div id="search-msg" role="status" aria-live="polite"></div>
    <div id="chooser" hidden>
      <div id="chooser-title"></div>
      <ul id="chooser-list" role="listbox" aria-label="Matching places"></ul>
    </div>
  </form>

  <div id="tip" role="status" aria-live="polite"><b></b><small></small></div>

  <section id="legend" aria-label="Map legend">
    <button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-body">
      <span id="legend-caption">Colors: countries</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
    </button>
    <div id="legend-body">
      <div id="legend-swatches" aria-hidden="true"></div>
      <ol id="legend-rows"></ol>
      <p class="lg-note">Neighbors never share a color. Zoom in for finer borders.</p>
      <div id="legend-land" hidden>
        <h3>Land ownership</h3>
        <ul id="legend-agencies"></ul>
        <p class="lg-note">Click any land for its owner. Parcel lines show up close in for Colorado; owner lookups also work in WI, NC, FL, VT, MT and MA.</p>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
